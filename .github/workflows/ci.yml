name: CI

# Run the tests on every push and pull request to master
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The job only needs to read the code
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      # No database needed: the tests mock the repository and the JobTech API
      - run: ./mvnw -B test
