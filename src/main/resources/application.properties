spring.application.name=pendla

# Local environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) are read from .env.
# "optional:" means the app does not fail at this point if .env is missing.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates and updates tables from the entities (MVP only, see docs/decisiones.md D7)
spring.jpa.hibernate.ddl-auto=update
