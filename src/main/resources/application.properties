spring.application.name=pendla

# Local environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) are read from .env.
# "optional:" means the app does not fail at this point if .env is missing.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema: on startup it runs the scripts in src/main/resources/db/migration
# that have not run yet (it keeps track in the flyway_schema_history table).

# Hibernate does not change the schema: it only checks on startup that it matches the entities.
spring.jpa.hibernate.ddl-auto=validate

# Close the database session when the service method ends, not when the HTTP response ends.
# Entities are mapped to DTOs inside the service, so the controller never needs it (F1-6).
spring.jpa.open-in-view=false

# JWT: the secret that signs the tokens comes from .env (JWT_SECRET, at least 32 characters).
# The expiration is not secret, so it lives here.
jwt.secret=${JWT_SECRET}
jwt.expiration=1h

# Registration is open unless REGISTRATION_ENABLED=false. On the public server it is switched off
# once my own user exists, so strangers cannot create accounts: POST /api/auth/register answers 403.
registration.enabled=${REGISTRATION_ENABLED:true}

# Hosting platforms say which port to listen on with the PORT variable. Locally it is 8080.
server.port=${PORT:8080}

# On the public server the app sits behind a proxy that receives HTTPS and forwards plain HTTP.
# This makes Spring read the X-Forwarded-* headers of the proxy, so Swagger builds https:// links.
server.forward-headers-strategy=framework

# JobTech JobSearch API (public, no API key). Not secret, so it lives here and not in .env.
jobtech.base-url=https://jobsearch.api.jobtechdev.se
jobtech.connect-timeout=3s
jobtech.read-timeout=5s
