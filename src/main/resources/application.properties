spring.application.name=pendla

# Local environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) are read from .env.
# "optional:" means the app does not fail at this point if .env is missing.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates and updates tables from the entities (MVP only, see docs/decisiones.md D7)
spring.jpa.hibernate.ddl-auto=update

# Close the database session when the service method ends, not when the HTTP response ends.
# Entities are mapped to DTOs inside the service, so the controller never needs it (F1-6).
spring.jpa.open-in-view=false

# JobTech JobSearch API (public, no API key). Not secret, so it lives here and not in .env.
jobtech.base-url=https://jobsearch.api.jobtechdev.se
jobtech.connect-timeout=3s
jobtech.read-timeout=5s
